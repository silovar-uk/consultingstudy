name: Cert Lab smoke test
on:
  push:
    branches: [main]
    paths:
      - 'cert-lab.js'
      - 'cert-lab-data.js'
      - 'cert-lab-crosswalk.js'
      - 'cert-lab-deep-data.js'
      - 'cert-lab-deep-ui.js'
      - 'tests/cert-lab-deep.mjs'
      - 'cert-lab-transfer-data.js'
      - 'cert-lab-transfer-ui.js'
      - 'tests/cert-lab-transfer.mjs'
      - 'data.js'
      - 'app.js'
      - 'index.html'
      - 'tests/cert-lab-smoke.mjs'
      - '.github/workflows/cert-lab-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run content and interaction smoke tests
        run: |
          node tests/cert-lab-smoke.mjs
          node tests/cert-lab-deep.mjs
          node tests/cert-lab-transfer.mjs
